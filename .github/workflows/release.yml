name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build package (tsup + tokens)
        run: npm run package:build

      - name: Archive dist
        run: tar -czf dist.tar.gz dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist.tar.gz
            dist/tokens.css
            dist/theme.css
          generate_release_notes: true
